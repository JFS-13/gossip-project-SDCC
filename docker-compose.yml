      - "8007:8007"   # metrics HTTP
    depends_on:
      - node1
    environment:
      <<: *env
      NETWORK_DELAY_MS: ${NODE7_DELAY:-${NETWORK_DELAY_MS:-0}}

  node8:
    <<: *node-base
