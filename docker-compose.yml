version: '3.8'

x-env: &env
  AGGREGATION_TYPE: ${AGGREGATION_TYPE:-}

x-node-base: &node-base
  build: .
  image: gossip-agent:local
  restart: unless-stopped
  cap_add:
    - NET_ADMIN
  networks:
    - gossip-net

services:
  node1:
    <<: *node-base
    container_name: gossip-node1
    volumes:
      - ./configs:/app/configs:ro
    command: ["--config", "/app/configs/node1.yaml"]
    ports:
      - "8001:8001"   # metrics HTTP
    environment:
      <<: *env
      NETWORK_DELAY_MS: ${NODE1_DELAY:-${NETWORK_DELAY_MS:-0}}

  node2:
    <<: *node-base
    container_name: gossip-node2
    volumes:
      - ./configs:/app/configs:ro
    command: ["--config", "/app/configs/node2.yaml"]
    ports:
      - "8002:8002"   # metrics HTTP
    depends_on:
      - node1
    environment:
      <<: *env
      NETWORK_DELAY_MS: ${NODE2_DELAY:-${NETWORK_DELAY_MS:-0}}

  node3:
    <<: *node-base
    container_name: gossip-node3
    volumes:
      - ./configs:/app/configs:ro
    command: ["--config", "/app/configs/node3.yaml"]
    ports:
      - "8003:8003"   # metrics HTTP
    depends_on:
      - node1
    environment:
      <<: *env
      NETWORK_DELAY_MS: ${NODE3_DELAY:-${NETWORK_DELAY_MS:-0}}

  node4:
    <<: *node-base
    container_name: gossip-node4
    volumes:
      - ./configs:/app/configs:ro
    command: ["--config", "/app/configs/node4.yaml"]
    ports:
      - "8004:8004"   # metrics HTTP
    depends_on:
      - node1
    environment:
      <<: *env
      NETWORK_DELAY_MS: ${NODE4_DELAY:-${NETWORK_DELAY_MS:-0}}

  node5:
    <<: *node-base
    container_name: gossip-node5
    volumes:
      - ./configs:/app/configs:ro
    command: ["--config", "/app/configs/node5.yaml"]
