      - "8005:8005"   # metrics HTTP
    depends_on:
      - node1
    environment:
      <<: *env
      NETWORK_DELAY_MS: ${NODE5_DELAY:-${NETWORK_DELAY_MS:-0}}

  node6:
    <<: *node-base
    container_name: gossip-node6
    volumes:
      - ./configs:/app/configs:ro
    command: ["--config", "/app/configs/node6.yaml"]
